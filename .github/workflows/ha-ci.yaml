name: Home Assistant integration CI

# Lint, type check, test and requirement checks shared by the Home Assistant custom
# integrations. The caller repository must provide the common layout:
# pyproject.toml + uv.lock (ty in the dev group), .python-version, scripts/check_translations.py
# and scripts/sync_requirements.py.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check --output-format github

      - name: Translations
        run: uv run python scripts/check_translations.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing

  requirements:
    name: Home Assistant constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # With the package constraints of the oldest supported Home Assistant
      - name: Check requirements against Home Assistant constraints
        run: python3 scripts/sync_requirements.py --check
