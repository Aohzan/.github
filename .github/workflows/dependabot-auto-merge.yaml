name: Dependabot auto-merge

# Enables auto-merge on Dependabot pull requests, except semver-major updates
# which stay for a manual review. GitHub merges once the required checks of the
# branch ruleset pass.
#
# The RELEASE_TOKEN secret (also stored as a Dependabot secret) is used when
# set, so that the merge triggers the release workflow.

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
