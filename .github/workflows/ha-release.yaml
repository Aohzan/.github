name: Home Assistant integration release

# semantic-release shared by the Home Assistant custom integrations. The caller
# repository provides .releaserc and scripts/release.sh.
#
# The RELEASE_TOKEN secret (a personal access token with contents write) is
# used when set: its pushes bypass the branch ruleset and its merges trigger
# workflows, which GITHUB_TOKEN does not do.

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/commit-analyzer@13
            @semantic-release/release-notes-generator@14
            conventional-changelog-conventionalcommits@9
            @semantic-release/changelog@7
            @semantic-release/exec@7
            @semantic-release/git@11
            @semantic-release/github@12
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
